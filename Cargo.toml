[package]
name = "urahafu"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A macOS screen-cleaning utility that blocks keyboard and trackpad input while you wipe the screen."
repository = "https://github.com/beeraw/urahafu"
readme = "README.md"
keywords = ["macos", "screen-clean", "utility", "accessibility"]
categories = ["os::macos-apis", "gui"]

[dependencies]
core-foundation = "0.10.1"
core-graphics = "0.25.0"
core-text = "22.0.0"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = [
    "NSButton",
    "NSControl",
    "NSFont",
    "NSImage",
    "NSImageView",
    "NSMenuItem",
    "NSPopUpButton",
    "NSStackView",
    "NSTextField",
    "NSUserInterfaceLayout",
    "NSView",
    "NSWindow",
] }
# `objc2-core-services` is only needed for the settings window's Dock/Finder "reopen" Apple Event
# handler (`src/platform/ffi/action_target.rs`): `NSAppleEventManager`'s selector-registration
# method is only compiled by `objc2-foundation` when its own "objc2-core-services" feature is on,
# and the event-class/event-id four-char-code constants (`kCoreEventClass`, `kAEReopenApplication`)
# live in this crate, not in objc2-foundation itself.
objc2-core-services = { version = "0.3.2", default-features = false, features = [
    "AE",
    "AEDataModel",
    "AERegistry",
    "AppleEvents",
    "objc2",
] }
objc2-foundation = { version = "0.3.2", features = [
    "NSAppleEventDescriptor",
    "NSAppleEventManager",
    "objc2-core-services",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CALayer"] }
softbuffer = "0.4"
thiserror = "2"
tray-icon = "0.24.2"
winit = "0.30"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[build-dependencies]
# Parses translations/*.xlf (XLIFF 1.2) at build time; a build-time-only dependency, never linked
# into the shipped binary. See docs/TRANSLATIONS.md and build.rs.
roxmltree = "0.21"

[dev-dependencies]
png = "0.18.1"

[package.metadata.bundle]
name = "Urahafu"
identifier = "com.beeraw.urahafu"
icon = ["design/app-icon/Urahafu.icns"]
version = "1.0.0"
copyright = "Copyright (c) 2026 the Urahafu contributors"
category = "public.app-category.utilities"
short_description = "Clean your screen and keyboard without triggering anything."
long_description = """
Urahafu is a macOS menu bar utility for cleaning your screen and keyboard safely: it shows a \
full-screen color and blocks the keyboard, trackpad and media keys while you wipe, so nothing you \
touch triggers an action. Unlock by pressing and holding the close button for 2 seconds. A fail-safe \
auto-unlock (30/60/90 seconds, configurable) always releases input even if something goes wrong. No \
keystrokes are ever recorded, logged or sent anywhere, and Urahafu never connects to the network.
"""
osx_minimum_system_version = "11.0"
# Generated by build.rs from packaging/Info.ext.plist.in + translations/*.xlf (the
# CFBundleLocalizations list follows whichever translations/*.xlf files exist, with no manual
# edit here); see docs/TRANSLATIONS.md.
osx_info_plist_exts = ["target/generated/Info.ext.plist"]
