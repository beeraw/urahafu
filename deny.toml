# cargo-deny configuration (v2 format).
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
# Urahafu ships a macOS app; only these two targets matter for dependency
# resolution (universal binary = arm64 + x86_64).
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
# In v2, any known vulnerability always fails the check.
# Yanked crates are not acceptable in a release build either.
yanked = "deny"
# Report unmaintained crates anywhere in the tree.
unmaintained = "all"

[licenses]
version = 2
# Anything not explicitly allowed below is denied.
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
# Duplicate versions happen naturally in a dependency tree (e.g. windows-sys
# pulled by unrelated crates); warn instead of failing the build on them.
multiple-versions = "warn"
# A wildcard version requirement ("*") gives no reproducibility guarantee.
wildcards = "deny"
allow-wildcard-paths = false

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
