name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build both architectures
        run: |
          cargo build --release --locked --target x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin

      - name: Combine into a universal binary
        run: |
          mkdir -p target/universal
          lipo -create -output target/universal/urahafu \
            target/x86_64-apple-darwin/release/urahafu \
            target/aarch64-apple-darwin/release/urahafu
          lipo -info target/universal/urahafu

      - name: Install cargo-bundle
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-bundle

      - name: Bundle the .app
        run: |
          # cargo-bundle only knows how to build for the host target, so it
          # produces an app bundle containing a single-arch binary. We then
          # swap that binary for the universal one built above, which keeps
          # cargo-bundle's Info.plist/icon handling while shipping a
          # universal executable inside Urahafu.app. cargo-bundle has no
          # --locked flag; the lockfile was already enforced by the builds above.
          cargo bundle --release
          cp target/universal/urahafu "target/release/bundle/osx/Urahafu.app/Contents/MacOS/urahafu"

      # The project certificate keeps the Accessibility permission across updates (see
      # packaging/sign.sh and SECURITY.md "Code signing"). It lives only in a throwaway keychain
      # for the duration of this job.
      - name: Import the signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12_BASE64" ] || [ -z "$CERT_PASSWORD" ]; then
            echo "::error::the MACOS_CERT_P12 and MACOS_CERT_PASSWORD secrets are required"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Codesign
        run: |
          packaging/sign.sh "target/release/bundle/osx/Urahafu.app"
          codesign --display --requirements - "target/release/bundle/osx/Urahafu.app" 2>&1 \
            | grep -q 'certificate leaf = H"11700e5903a230d75a389ffd99928a689f5fa11a"'

      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
          fi

      - name: Zip the app
        working-directory: target/release/bundle/osx
        run: ditto -c -k --keepParent "Urahafu.app" "Urahafu-${{ steps.version.outputs.version }}.zip"

      - name: Checksum
        working-directory: target/release/bundle/osx
        run: shasum -a 256 "Urahafu-${{ steps.version.outputs.version }}.zip" > "Urahafu-${{ steps.version.outputs.version }}.zip.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: target/release/bundle/osx
        run: |
          gh release create "${{ github.ref_name }}" \
            "Urahafu-${{ steps.version.outputs.version }}.zip" \
            "Urahafu-${{ steps.version.outputs.version }}.zip.sha256" \
            --title "Urahafu ${{ github.ref_name }}" \
            --generate-notes
