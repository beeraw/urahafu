<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18">
  <defs>
    <mask id="foldCut">
      <rect x="0" y="0" width="18" height="18" fill="#fff"/>
      <polygon points="11,4 14.6,4 14.6,7.6" fill="#000"/>
    </mask>
  </defs>
  <!-- Cleaning cloth: rounded square with a folded (dog-ear) corner -->
  <rect x="4" y="4" width="10.6" height="9.6" rx="2.1" fill="#000" mask="url(#foldCut)"/>
  <polygon points="11,4 14.6,7.6 11,7.6" fill="#000"/>
  <!-- wipe motion swoosh -->
  <path fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round"
    d="M2.3 6 q-1.2 2.2 0 4.2" />
</svg>
