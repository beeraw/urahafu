<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 700" width="1440" height="700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0A7C93"/>
    </marker>
    <marker id="arrowLoop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#22B8C8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1440" height="700" fill="#FAFAFA"/>

  <text x="60" y="46" font-family="SF Pro Display" font-weight="600" font-size="22" fill="#1D1D1F" fill-opacity="0.9">Timeline of a cleaning session</text>

  <!-- ============ ROW 1 — main flow ============ -->
  <!-- boxes at x 150/450/750/1050, width 240, y 100-220 -->
  <g font-family="SF Pro Text">
    <g>
      <rect x="150" y="100" width="240" height="120" rx="10" fill="#F5F5F7" stroke="#D5D8DB"/>
      <text x="270" y="140" text-anchor="middle" font-weight="600" font-size="14" fill="#1D1D1F" fill-opacity="0.88">Countdown</text>
      <text x="270" y="160" text-anchor="middle" font-weight="400" font-size="12" fill="#1D1D1F" fill-opacity="0.55">"3" → "2" → "1"</text>
      <text x="270" y="180" text-anchor="middle" font-weight="400" font-size="11" fill="#1D1D1F" fill-opacity="0.45">cancellable (Esc / click)</text>
    </g>
    <g>
      <rect x="450" y="100" width="240" height="120" rx="10" fill="#F5F5F7" stroke="#D5D8DB"/>
      <text x="570" y="140" text-anchor="middle" font-weight="600" font-size="14" fill="#1D1D1F" fill-opacity="0.88">Screen locked</text>
      <text x="570" y="160" text-anchor="middle" font-weight="400" font-size="12" fill="#1D1D1F" fill-opacity="0.55">hint + ✕ button visible</text>
      <text x="570" y="180" text-anchor="middle" font-weight="400" font-size="11" fill="#1D1D1F" fill-opacity="0.45">keyboard, clicks, scroll blocked</text>
    </g>
    <g>
      <rect x="750" y="100" width="240" height="120" rx="10" fill="#F5F5F7" stroke="#D5D8DB"/>
      <text x="870" y="140" text-anchor="middle" font-weight="600" font-size="14" fill="#1D1D1F" fill-opacity="0.88">Hint fade-out</text>
      <text x="870" y="160" text-anchor="middle" font-weight="400" font-size="12" fill="#1D1D1F" fill-opacity="0.55">ease-in-out</text>
    </g>
    <g>
      <rect x="1050" y="100" width="240" height="120" rx="10" fill="#EAF7F7" stroke="#22B8C8"/>
      <text x="1170" y="140" text-anchor="middle" font-weight="600" font-size="14" fill="#0A7C93">Idle</text>
      <text x="1170" y="160" text-anchor="middle" font-weight="400" font-size="12" fill="#1D1D1F" fill-opacity="0.6">quiet screen</text>
      <text x="1170" y="180" text-anchor="middle" font-weight="400" font-size="11" fill="#1D1D1F" fill-opacity="0.45">only the 2 pt bar stays visible</text>
    </g>
  </g>

  <!-- row1 arrows -->
  <line x1="390" y1="160" x2="446" y2="160" stroke="#0A7C93" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="418" y="148" text-anchor="middle" font-family="SF Pro Text" font-size="11" fill="#1D1D1F" fill-opacity="0.55">1000 ms × 3</text>

  <line x1="690" y1="160" x2="746" y2="160" stroke="#0A7C93" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="718" y="148" text-anchor="middle" font-family="SF Pro Text" font-size="11" fill="#1D1D1F" fill-opacity="0.55">6 s</text>

  <line x1="990" y1="160" x2="1046" y2="160" stroke="#0A7C93" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1018" y="148" text-anchor="middle" font-family="SF Pro Text" font-size="11" fill="#1D1D1F" fill-opacity="0.55">1.2 s</text>

  <text x="270" y="98" text-anchor="middle" font-family="SF Pro Text" font-size="10" fill="#1D1D1F" fill-opacity="0.4">each digit: 150 ms in · 200 ms out</text>

  <!-- ============ down arrow into loop ============ -->
  <path d="M1170 220 V262 H270 V276" fill="none" stroke="#22B8C8" stroke-width="1.6" marker-end="url(#arrowLoop)"/>
  <text x="720" y="256" text-anchor="middle" font-family="SF Pro Text" font-size="11" fill="#0A7C93">any blocked input (key, click, scroll, media key)</text>

  <!-- ============ ROW 2 — re-show loop ============ -->
  <g font-family="SF Pro Text">
    <g>
      <rect x="150" y="280" width="240" height="110" rx="10" fill="#F5F5F7" stroke="#D5D8DB"/>
      <text x="270" y="318" text-anchor="middle" font-weight="600" font-size="14" fill="#1D1D1F" fill-opacity="0.88">Reappearance</text>
      <text x="270" y="338" text-anchor="middle" font-weight="400" font-size="12" fill="#1D1D1F" fill-opacity="0.55">hint, ✕ button, 2nd line</text>
      <text x="270" y="356" text-anchor="middle" font-weight="400" font-size="11" fill="#1D1D1F" fill-opacity="0.45">200 ms fade-in</text>
    </g>
    <g>
      <rect x="450" y="280" width="240" height="110" rx="10" fill="#F5F5F7" stroke="#D5D8DB"/>
      <text x="570" y="318" text-anchor="middle" font-weight="600" font-size="14" fill="#1D1D1F" fill-opacity="0.88">Hold</text>
      <text x="570" y="338" text-anchor="middle" font-weight="400" font-size="12" fill="#1D1D1F" fill-opacity="0.55">2.5 s</text>
      <text x="570" y="356" text-anchor="middle" font-weight="400" font-size="11" fill="#1D1D1F" fill-opacity="0.45">restarted by any new input</text>
    </g>
    <g>
      <rect x="750" y="280" width="240" height="110" rx="10" fill="#F5F5F7" stroke="#D5D8DB"/>
      <text x="870" y="318" text-anchor="middle" font-weight="600" font-size="14" fill="#1D1D1F" fill-opacity="0.88">Fade-out</text>
      <text x="870" y="338" text-anchor="middle" font-weight="400" font-size="12" fill="#1D1D1F" fill-opacity="0.55">1.2 s</text>
    </g>
    <g>
      <rect x="1050" y="280" width="240" height="110" rx="10" fill="#F5F5F7" stroke="#D5D8DB"/>
      <text x="1170" y="318" text-anchor="middle" font-weight="600" font-size="14" fill="#1D1D1F" fill-opacity="0.88">Hold the ✕ button</text>
      <text x="1170" y="338" text-anchor="middle" font-weight="400" font-size="12" fill="#1D1D1F" fill-opacity="0.55">ring fills over 2.0 s</text>
      <text x="1170" y="356" text-anchor="middle" font-weight="400" font-size="11" fill="#1D1D1F" fill-opacity="0.45">released/left before completion → 200 ms drain</text>
    </g>
  </g>

  <line x1="390" y1="335" x2="446" y2="335" stroke="#0A7C93" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="690" y1="335" x2="746" y2="335" stroke="#0A7C93" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="990" y1="335" x2="1046" y2="335" stroke="#0A7C93" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- loop back to Idle -->
  <path d="M1170 280 V262 H1170" fill="none" stroke="#22B8C8" stroke-width="1.6" marker-end="url(#arrowLoop)"/>
  <text x="1245" y="256" text-anchor="middle" font-family="SF Pro Text" font-size="10" fill="#0A7C93">back to idle</text>

  <!-- divider -->
  <line x1="60" y1="435" x2="1380" y2="435" stroke="#D5D8DB" stroke-width="1"/>
  <text x="60" y="464" font-family="SF Pro Text" font-weight="600" font-size="13" fill="#1D1D1F" fill-opacity="0.6">Two paths lead to unlocking</text>

  <!-- ============ ROW 3 — unlock ============ -->
  <g font-family="SF Pro Text">
    <g>
      <rect x="150" y="480" width="340" height="70" rx="10" fill="#F5F5F7" stroke="#D5D8DB"/>
      <text x="320" y="510" text-anchor="middle" font-weight="600" font-size="13" fill="#1D1D1F" fill-opacity="0.85">Completed ✕ button hold</text>
      <text x="320" y="530" text-anchor="middle" font-weight="400" font-size="11" fill="#1D1D1F" fill-opacity="0.5">full ring after 2.0 s</text>
    </g>
    <g>
      <rect x="150" y="570" width="340" height="70" rx="10" fill="#F5F5F7" stroke="#D5D8DB"/>
      <text x="320" y="600" text-anchor="middle" font-weight="600" font-size="13" fill="#1D1D1F" fill-opacity="0.85">Fail-safe unlock</text>
      <text x="320" y="620" text-anchor="middle" font-weight="400" font-size="11" fill="#1D1D1F" fill-opacity="0.5">bar reaches 0 after 30 / 60 / 90 s (default 60 s)</text>
    </g>

    <line x1="490" y1="515" x2="556" y2="515" stroke="#0A7C93" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="490" y1="605" x2="556" y2="605" stroke="#0A7C93" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="560" y="480" width="300" height="140" rx="10" fill="#EAF7F7" stroke="#22B8C8"/>
    <text x="710" y="540" text-anchor="middle" font-weight="600" font-size="14" fill="#0A7C93">Unlock</text>
    <text x="710" y="560" text-anchor="middle" font-weight="400" font-size="12" fill="#1D1D1F" fill-opacity="0.6">button briefly scales up</text>
    <text x="710" y="578" text-anchor="middle" font-weight="400" font-size="11" fill="#1D1D1F" fill-opacity="0.45">150 ms</text>

    <line x1="860" y1="550" x2="916" y2="550" stroke="#0A7C93" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="920" y="480" width="320" height="140" rx="10" fill="#F5F5F7" stroke="#D5D8DB"/>
    <text x="1080" y="540" text-anchor="middle" font-weight="600" font-size="14" fill="#1D1D1F" fill-opacity="0.88">Overlay fade-out</text>
    <text x="1080" y="560" text-anchor="middle" font-weight="400" font-size="12" fill="#1D1D1F" fill-opacity="0.55">300 ms</text>
    <text x="1080" y="580" text-anchor="middle" font-weight="400" font-size="11" fill="#1D1D1F" fill-opacity="0.45">blocking is removed before the fade-out</text>
  </g>
</svg>
